<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(180deg, #a8c6d8, #eaf4f4);
}

.card {
    background: white;
    padding: 20px;
    border-radius: 20px;
    max-width: 500px;
    margin: auto;
}

input {
    display: none;
}

.choice {
    display: block;
    padding: 15px;
    margin: 10px 0;
    background: #2f3e4e;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

.message {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
}

/* afficher message juste après le choix */
input:checked + label + .message {
    display: block;
}

.success {
    background: #dff5e1;
}

.error {
    background: #fde2e2;
}

img {
    max-width: 200px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">

<h2>Quel symbole représente l’espérance ?</h2>

<!-- Mauvaise -->
<input type="radio" name="qcm" id="r1">
<label for="r1" class="choice">✝️ La croix</label>
<div class="message error">❌ Mauvaise réponse</div>

<!-- Mauvaise -->
<input type="radio" name="qcm" id="r2">
<label for="r2" class="choice">⚔️ L’épée</label>
<div class="message error">❌ Mauvaise réponse</div>

<!-- Bonne -->
<input type="radio" name="qcm" id="r3">
<label for="r3" class="choice">⚓ L’ancre</label>
<div class="message success">
    ✅ Bonne réponse !<br>
 <img src="Vitrailancre.png">
</div>

</div>

</body>
</html>
