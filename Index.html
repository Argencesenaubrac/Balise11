<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM - Le secret du clocher</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #a8c6d8, #eaf4f4);
    text-align: center;
    color: #2f3e4e;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 30px 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.story {
    font-style: italic;
    margin-bottom: 20px;
    color: #5a6b7a;
}

h1 {
    font-size: 20px;
    margin-bottom: 20px;
}

/* cacher les radios */
input[type="radio"] {
    display: none;
}

/* boutons */
.choice {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    background: #2f3e4e;
    color: white;
    transition: 0.3s;
}

.choice:hover {
    background: #1f2a35;
}

/* messages */
.message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
}

#success {
    background: #dff5e1;
    border-left: 5px solid #2e7d32;
}

#error {
    background: #fde2e2;
    border-left: 5px solid #c62828;
}

/* logique CSS */
#correct:checked ~ #success {
    display: block;
}

#wrong1:checked ~ #error,
#wrong2:checked ~ #error {
    display: block;
}

/* image */
#success img {
    margin-top: 15px;
    max-width: 250px;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <p class="story">
            Garance observe le vitrail :<br>
            “Quatre symboles y sont représentés…”
        </p>

        <h1>
        🧭 Quel symbole représente l’espérance sur le plan spirituel ?
        </h1>

        <!-- choix -->
        <input type="radio" name="qcm" id="wrong1">
        <label for="wrong1" class="choice">✝️ La croix</label>

        <input type="radio" name="qcm" id="wrong2">
        <label for="wrong2" class="choice">⚔️ L’épée</label>

        <input type="radio" name="qcm" id="correct">
        <label for="correct" class="choice">⚓ L’ancre</label>

        <!-- messages -->
        <div id="success" class="message">
            ✅ Bonne réponse !<br>
            L’ancre représente l’espérance.<br>
            <img src="https://raw.githubusercontent.com/Argencesenaubrac/Balise11/main/Vitrailancre.png">
        </div>

        <div id="error" class="message">
            ❌ Mauvaise réponse… Essaie encore !
        </div>

    </div>
</div>

</body>
</html>
